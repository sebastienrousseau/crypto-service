version = 1

test_patterns = [
  "**/__tests__/**",
  "**/*.test.ts",
  "**/*.test.js",
]

exclude_patterns = [
  "**/dist/**",
  "**/node_modules/**",
  "**/coverage/**",
  "pnpm-lock.yaml",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  dialect = "typescript"
  environment = ["nodejs", "mocha"]
  module_system = "es-modules"
  skip_doc_coverage = [
    "function-declaration",
    "function-expression",
    "arrow-function-expression",
    "class-declaration",
    "class-expression",
    "method-definition",
  ]

[[transformers]]
name = "prettier"
enabled = true

version = 1

exclude_patterns = [
  "**/dist/**",
  "**/node_modules/**",
  "**/__tests__/**",
  "**/examples/**",
  "benchmarks/**",
  "packages/crypto-api/src/docs/**",
  "packages/crypto-lib/src/key/**",
  "packages/crypto-lib/src/data/**",
  "packages/crypto-lib/src/bin/**",
  "packages/crypto-cli/src/cli.ts",
  "**/.mocharc.cjs",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs", "mocha"]
  dialect = "typescript"
  module_system = "commonjs"
  cyclomatic_complexity_threshold = "high"
  skip_doc_coverage = [
    "function-declaration",
    "function-expression",
    "arrow-function-expression",
    "method-definition",
    "class-declaration",
    "class-expression",
  ]

# Disable false-positive rules for TypeScript modules
[[analyzers.rules]]
rule_id = "JS-0067"
enabled = false

[[analyzers.rules]]
rule_id = "JS-0359"
enabled = false

[[analyzers.rules]]
rule_id = "JS-C1002"
enabled = false

[[analyzers.rules]]
rule_id = "JS-0240"
enabled = false

[[analyzers.rules]]
rule_id = "JS-0246"
enabled = false

[[analyzers.rules]]
rule_id = "JS-E1009"
enabled = false

[[analyzers.rules]]
rule_id = "JS-C1003"
enabled = false

[[analyzers.rules]]
rule_id = "JS-0327"
enabled = false

[[analyzers.rules]]
rule_id = "JS-0357"
enabled = false

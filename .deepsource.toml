version = 1

exclude_patterns = [
  "**/dist/**",
  "**/node_modules/**",
  "**/__tests__/**",
  "**/examples/**",
  "benchmarks/**",
  "packages/crypto-api/src/docs/**",
  "packages/crypto-lib/src/key/**",
  "packages/crypto-lib/src/data/**",
  "packages/crypto-lib/src/bin/**",
  "packages/crypto-cli/src/cli.ts",
  "**/.mocharc.cjs",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs", "mocha"]
  dialect = "typescript"
  module_system = "commonjs"
  cyclomatic_complexity_threshold = "high"
  skip_doc_coverage = [
    "function-declaration",
    "function-expression",
    "arrow-function-expression",
    "method-definition",
    "class-declaration",
    "class-expression",
  ]

[metrics.doc_coverage]
enabled = false

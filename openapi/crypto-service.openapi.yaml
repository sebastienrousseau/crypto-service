components:
  schemas:
    Problem:
      additionalProperties: true
      description: "RFC 9457 problem details (application/problem+json)."
      properties:
        code:
          description: "Error code from crypto-lib, the key store or a KMS provider (e.g. INVALID_HEX, KEY_NOT_FOUND)."
          type: string
        detail:
          description: "Explanation of this occurrence, safe to show the client."
          type: string
        errors:
          description: "Each field that failed validation (validation-failed)."
          items:
            properties:
              field:
                description: "The field, as a JSON pointer or a body field name."
                type: string
              message:
                type: string
            required:
              - field
              - message
            type: object
          type: array
        instance:
          description: "Request path, without the query string."
          type: string
        limit:
          description: "Requests a tenant may make per minute (tenant quota)."
          type: integer
        resetSeconds:
          description: "Seconds until the tenant quota resets."
          type: integer
        status:
          description: "HTTP status code."
          type: integer
        title:
          description: "Summary of the problem type."
          type: string
        type:
          description: "Problem type, `urn:crypto-service:problem:<slug>`; stable and machine-readable."
          pattern: "^urn:crypto-service:problem:[a-z-]+$"
          type: string
      required:
        - type
        - title
        - status
        - detail
      type: object
  securitySchemes:
    apiKey:
      description: "The static key in CRYPTO_API_KEY. It holds crypto:admin, which grants every scope except crypto:keys:export."
      in: header
      name: x-api-key
      type: apiKey
    bearerAuth:
      bearerFormat: JWT
      description: "An HS256 JWT signed with JWT_SECRET. Claims: sub (required; not api-key or anonymous), iat and exp (required; lifetime at most JWT_MAX_AGE seconds, default 3600), iss and aud (when JWT_ISSUER and JWT_AUDIENCE are set, as production requires), scopes (array of scope strings). Tried first when the Authorization header carries a Bearer token."
      scheme: bearer
      type: http

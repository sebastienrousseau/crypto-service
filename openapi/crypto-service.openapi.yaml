                          type: array
                        type:
                          type: string
                        version:
                          type: string
                      type: object
                    type: array
                  metadata:
                    additionalProperties: true
                    type: object
                  serialNumber:
                    description: "A fresh urn:uuid for every document."
                    pattern: "^urn:uuid:[0-9a-f-]{36}$"
                    type: string
                  specVersion:
                    description: "CycloneDX specification version."
                    enum:
                      - "1.6"
                    type: string
                  version:
                    description: "BOM version."
                    type: integer
                required:
                  - bomFormat
                  - specVersion
                  - serialNumber
                  - version
                  - metadata
                  - components
                type: object

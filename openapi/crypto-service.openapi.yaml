                description: "CycloneDX 1.6 cryptographic bill of materials."
                properties:
                  bomFormat:
                    description: "Always CycloneDX."
                    enum:
                      - CycloneDX
                    type: string
                  components:
                    items:
                      additionalProperties: true
                      properties:
                        name:
                          type: string
                        properties:

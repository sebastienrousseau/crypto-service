version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      noble-crypto:
        patterns:
          - "@noble/*"
      fastify:
        patterns:
          - "fastify"
          - "fastify-*"
          - "@fastify/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      types:
        patterns:
          - "@types/*"
      dev-tools:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "typescript"
          - "typedoc*"
          - "mocha"
          - "chai*"
          - "c8"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      noble-crypto:
        patterns:
          - "@noble/*"
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      noble-crypto:
        patterns:
          - "@noble/*"
      fastify:
        patterns:
          - "fastify"
          - "fastify-*"
          - "@fastify/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      types:
        patterns:
          - "@types/*"
      # cli and config-conventional release together.
      commitlint:
        patterns:
          - "@commitlint/*"
      dev-tools:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "typescript"
          - "typedoc*"
          - "mocha"
          - "chai*"
          - "c8"
    open-pull-requests-limit: 10
    # Wait three days before proposing a new version, so a compromised
    # release is likely pulled first. Security updates are not delayed.
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The OpenTelemetry 0.300 / 3.0 line needs @opentelemetry/api
      # 1.10, but @fastify/otel 0.21.3 still pulls @opentelemetry/core
      # 2.12, which only accepts api below 1.10. Remove these once a
      # @fastify/otel release depends on core 3 and instrumentation 0.300.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/resources"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-metrics"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-node"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/exporter-metrics-otlp-http"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/instrumentation-http"
        versions: [">=0.300.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Every step must run the same version: CodeQL refuses a
      # configuration written by another.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: pnpm -r run lint
      - run: pnpm -r run format:check
      - run: pnpm run format:root
      - name: Complexity gate (baseline may only shrink)
        run: node scripts/complexity-check.mjs
      - run: pnpm -r run test

  # Runs the Vault Transit suite of crypto-kms against a real Vault dev
  # server, so FakeVault (used everywhere else) stays faithful to Vault.
  kms-vault-integration:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault@sha256:268bb80aa9c6d13d65fcfa05c0c268caca068952240a8087291a6ce0b66e3a10 # 1.20.4
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@sebastienrousseau/crypto-kms..." run build
      - name: Mount the transit engine
        run: >-
          curl -sf -H "X-Vault-Token: root" -X POST -d '{"type":"transit"}'
          http://127.0.0.1:8200/v1/sys/mounts/transit
      - name: Vault Transit suite against the real server
        working-directory: packages/crypto-kms
        env:
          VAULT_TEST_ADDR: http://127.0.0.1:8200
          VAULT_TEST_TOKEN: root
        run: npx mocha --config=.mocharc.cjs --spec __tests__/vault-transit.test.ts

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: pnpm -r run lint
      - run: pnpm -r run test

  docs-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - name: Build TypeDoc API documentation
        run: pnpm -r run docs
      - name: Type-check crypto-lib examples
        run: pnpm --filter @sebastienrousseau/crypto-lib run examples:check
      - name: Type-check crypto-sdk examples
        run: pnpm --filter @sebastienrousseau/crypto-sdk run examples:check
      - name: Check publishable manifests
        run: node scripts/check-manifests.mjs
      - name: Package index is generated from the manifests
        run: node scripts/packages-index.mjs --check
      # publint on each manifest, attw on each packed tarball.
      - name: Check package exports and types
        run: pnpm run check:packages
      # Installs the packed tarballs as a user would, requires and imports
      # every exported entry point and boots the server, catching runtime
      # imports missing from "dependencies".
      - name: Pack and install smoke test
        run: ./scripts/pack-smoke.sh
      - name: Check markdownlint
        run: npx --yes markdownlint-cli "**/*.md" --ignore "**/node_modules/**" --ignore "**/dist/**"

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # publish to GitHub Packages
      id-token: write # npm --provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Refuse to publish if the tag and the manifests disagree or a
      # manifest would be rejected (npm provenance needs repository.url).
      - name: Preflight manifests against the tag
        run: node scripts/check-manifests.mjs --tag "$GITHUB_REF_NAME"

      - run: pnpm -r run build
      - run: pnpm -r run test

      - name: Verify tarball contents
        run: |
          for pkg in packages/*/; do
            echo "=== $(basename "$pkg") ==="
            cd "$pkg"
            npm pack --dry-run 2>&1 | grep -E "package size|total files"
            cd ../..
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true

      # Fails rather than silently skipping when the token is missing.
      # pnpm skips package versions that are already on the registry.
      - name: Publish to npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set; cannot publish to npm."
            exit 1
          fi
          pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          sed -i 's|https://registry.npmjs.org/|https://npm.pkg.github.com/|g' .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> "$NPM_CONFIG_USERCONFIG"
          for pkg in packages/*/; do
            node -e "const fs = require('fs'); const file = '${pkg}package.json'; const p = JSON.parse(fs.readFileSync(file, 'utf8')); p.publishConfig = { access: 'public', registry: 'https://npm.pkg.github.com' }; fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');"
          done
          pnpm -r publish --no-git-checks

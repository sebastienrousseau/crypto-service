name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Installs, builds, tests and packs with a read-only token: dependency
  # code (install scripts, tests) runs here, so this job holds no write
  # permission and does not persist the token in .git/config.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Refuse to publish if the tag and the manifests disagree or a
      # manifest would be rejected (npm provenance needs repository.url).
      - name: Preflight manifests against the tag
        run: node scripts/check-manifests.mjs --tag "$GITHUB_REF_NAME"

      - run: pnpm -r run build
      - run: pnpm -r run test

      - name: Verify tarball contents
        run: |
          for pkg in packages/*/; do
            echo "=== $(basename "$pkg") ==="
            cd "$pkg"
            npm pack --dry-run 2>&1 | grep -E "package size|total files"
            cd ../..
          done

      # Pack once, after the tests; both registries publish exactly these.
      - name: Pack npm tarballs
        run: scripts/pack-npm.sh npm-tarballs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: npm-tarballs/*.tgz
          if-no-files-found: error

  # Creates the GitHub release and publishes the packed tarballs to GitHub
  # Packages. It holds write permissions, so it runs no dependency code:
  # no checkout, no install, only the tarballs the build job made.
  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # publish to GitHub Packages
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: npm-tarballs

      # The ./ prefix matters: npm reads a bare `dir/file.tgz` as a GitHub
      # `owner/repo` shorthand and tries to clone it. Versions already in
      # the registry are skipped, so a re-run after a partial failure
      # publishes only what is missing.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry=https://npm.pkg.github.com
          for tarball in ./npm-tarballs/*.tgz; do
            spec="$(tar -xOzf "$tarball" package/package.json |
              node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{const p=JSON.parse(s);console.log(p.name+"@"+p.version)})')"
            if npm view "$spec" version --registry "$registry" >/dev/null 2>&1; then
              echo "$spec already in GitHub Packages, skipped"
              continue
            fi
            npm publish "$tarball" --access public --registry "$registry"
          done

  # Publishes to npm only after a maintainer approves the `npm`
  # environment (required reviewer, v* tags only). Each package's npm
  # trusted publisher accepts this repository's release.yml in that
  # environment, so no token is stored and nothing reaches npm without
  # the approval. npm attaches provenance to every version.
  npm:
    needs: [build, github]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # bundles npm >= 11.5.1, needed for npm trusted publishing
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: npm-tarballs

      - name: Publish to npm
        run: scripts/publish-npm.sh npm-tarballs

      # Read every version back and fail unless it is public on npm with
      # a provenance attestation.
      - name: Verify npm provenance
        run: node scripts/check-provenance.mjs "${GITHUB_REF_NAME#v}"

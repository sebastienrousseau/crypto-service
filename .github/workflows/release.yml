name: Release

on:
  push:
    tags: ["v*"]
  # Publishes a release that already exists, when its own run did not
  # reach the registries: no build, only the tarballs attached to the
  # release, checked against the checksums in its notes. Run it from main.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.0.36)"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Installs, builds, tests and packs with a read-only token: dependency
  # code (install scripts, tests) runs here, so this job holds no write
  # permission and does not persist the token in .git/config.
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Refuse to publish if the tag and the manifests disagree or a
      # manifest would be rejected (npm provenance needs repository.url).
      - name: Preflight manifests against the tag
        run: node scripts/check-manifests.mjs --tag "$TAG"

      # Refuse a tag whose hand-written Highlights are missing, malformed
      # or left over from another release, before anything is published.
      - name: Preflight release highlights
        run: node scripts/release-notes.mjs check "$TAG"

      - run: pnpm -r run build
      - run: pnpm -r run test

      - name: Verify tarball contents
        run: |
          for pkg in packages/*/; do
            echo "=== $(basename "$pkg") ==="
            cd "$pkg"
            npm pack --dry-run 2>&1 | grep -E "package size|total files"
            cd ../..
          done

      # Pack once, after the tests; both registries publish exactly these.
      - name: Pack npm tarballs
        run: scripts/pack-npm.sh npm-tarballs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: npm-tarballs/*.tgz
          if-no-files-found: error

  # Creates the GitHub release and publishes the packed tarballs to GitHub
  # Packages. It holds write permissions, so it runs no dependency code:
  # no install, only the tarballs the build job made (or, when publishing
  # an existing release, the ones attached to it) and this repository's
  # own dependency-free scripts.
  github:
    needs: build
    if: >-
      !cancelled() && (needs.build.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # publish to GitHub Packages
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # record the attestation on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'push'
        with:
          name: npm-tarballs
          path: npm-tarballs

      # SLSA build provenance for the tarballs, signed through Sigstore and
      # recorded on the repository (`gh attestation verify <tarball>
      # --repo sebastienrousseau/crypto-service`). The bundle is attached
      # to the release as well.
      - name: Attest the tarballs' build provenance
        id: attest
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: npm-tarballs/*.tgz

      # Title, notes and assets in the house template: the Highlights come
      # from .github/release-highlights.md (checked in the build job), the
      # pull requests and changelog link from GitHub's generated notes, and
      # the checksums from the assets themselves.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          assets=(npm-tarballs/*.tgz "crypto-service-${TAG#v}.intoto.jsonl")
          cp "$BUNDLE" "${assets[-1]}"
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" \
            --jq .body >generated-notes.md
          node scripts/release-notes.mjs compose "$TAG" generated-notes.md \
            "${assets[@]}" >release-notes.md
          gh release create "$TAG" --verify-tag \
            --title "crypto-service ${TAG#v}" \
            --notes-file release-notes.md "${assets[@]}"

      - name: Download the release's own tarballs
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-assets.sh "$TAG" npm-tarballs

      # The ./ prefix matters: npm reads a bare `dir/file.tgz` as a GitHub
      # `owner/repo` shorthand and tries to clone it. Versions already in
      # the registry are skipped, so a re-run after a partial failure
      # publishes only what is missing. The repository's .npmrc (checked
      # out above) maps @sebastienrousseau to npmjs, and a scope mapping
      # beats --registry, so every call also maps the scope to GitHub
      # Packages.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry=https://npm.pkg.github.com
          to=(--registry "$registry" "--@sebastienrousseau:registry=$registry")
          for tarball in ./npm-tarballs/*.tgz; do
            spec="$(tar -xOzf "$tarball" package/package.json |
              node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{const p=JSON.parse(s);console.log(p.name+"@"+p.version)})')"
            if npm view "$spec" version "${to[@]}" >/dev/null 2>&1; then
              echo "$spec already in GitHub Packages, skipped"
              continue
            fi
            npm publish "$tarball" --access public "${to[@]}"
          done

  # Publishes to npm only after a maintainer approves the `npm`
  # environment (required reviewer; v* tags, and main while a maintainer
  # allows it for publishing an existing release). Each package's npm
  # trusted publisher accepts this repository's release.yml in that
  # environment, so no token is stored and nothing reaches npm without
  # the approval. npm attaches provenance to every version.
  npm:
    needs: [build, github]
    if: ${{ !cancelled() && needs.github.result == 'success' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # bundles npm >= 11.5.1, needed for npm trusted publishing
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'push'
        with:
          name: npm-tarballs
          path: npm-tarballs

      - name: Download the release's own tarballs
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-assets.sh "$TAG" npm-tarballs

      - name: Publish to npm
        run: scripts/publish-npm.sh npm-tarballs

      # Read every version back and fail unless it is public on npm with
      # a provenance attestation.
      - name: Verify npm provenance
        run: node scripts/check-provenance.mjs "${TAG#v}"

# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Suite consistency (docs/adr/0005-suite-lockstep-with-sdks-and-site.md):
# every member of docs/ecosystem.json must carry the same released
# version: signed tag, GitHub release with its checksums, registry
# publication, and the site's VERSION. Runs when a release is published,
# daily, and on demand. A failure opens (or comments on) one tracking
# issue, so drift is never silent.
name: Suite consistency

on:
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Suite version to check, e.g. 0.0.40 (default: latest release)"
        required: false

permissions:
  contents: read

concurrency:
  group: suite-consistency
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open or update the drift issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The latest published release, unless a version was given: the
      # check is about what users can install, not the branch's version.
      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName | ltrimstr("v")')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check every member
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/check-ecosystem.mjs --version "$VERSION" | tee report.txt

      - name: Report drift
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Suite drift at ${VERSION}"
          fence='```'
          {
            echo "scripts/check-ecosystem.mjs found members out of step with ${VERSION}."
            echo
            echo "${fence}text"
            cat report.txt
            echo "${fence}"
            echo
            echo "Run: ${RUN_URL}"
          } > body.md
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi

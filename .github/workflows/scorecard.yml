# OpenSSF Scorecard: supply-chain security posture, uploaded to code
# scanning and published to the public Scorecard API (for the badge).
# Layout follows the ossf/scorecard-action README example workflow.
name: Scorecard

on:
  # Re-run when branch protection changes (Branch-Protection check).
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 2" # Weekly Tuesday 05:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

# Everything read-only by default; the job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish_results: sign results via OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

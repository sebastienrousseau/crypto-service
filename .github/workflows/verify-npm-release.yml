name: Verify npm release

# Run after approving the staged npm versions of a release: fails unless
# every package is public at that version with a provenance attestation.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version, without the v (e.g. 0.0.9)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check every package is on npm with provenance
        run: node scripts/check-provenance.mjs "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

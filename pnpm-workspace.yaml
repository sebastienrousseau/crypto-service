packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
  # exclude packages that are inside test directories
  - '!**/__tests__/**'

# Install missing peer dependencies (pnpm reads this here, not from
# .npmrc, which npm also reads and warns about).
autoInstallPeers: true

# Refuse a dependency version published less than a day ago: most
# malicious releases are found and pulled within hours.
minimumReleaseAge: 1440

allowBuilds:
  '@prisma/client': false
  protobufjs: false

# Each override keeps the patched floor of an advisory and stops below the
# next major after the one that resolves today (the next minor for 0.x),
# so a fresh resolution cannot jump to an incompatible or unvetted major.
# An override that matches nothing in the lockfile stops below the next
# major after the latest release.
overrides:
  "@grpc/grpc-js": ">=1.14.5 <2"
  "@protobufjs/utf8": ">=1.1.2 <2"
  "@tootallnate/once": ">=2.0.1 <4"
  "body-parser": ">=1.20.8 <3"
  "brace-expansion": ">=1.1.17 <6"
  "chokidar": ">=5.0.0 <6"
  "fast-jwt": ">=6.3.4 <7"
  "form-data": ">=2.5.6 <5"
  "ip-address": ">=10.5.1 <11"
  "js-yaml": ">=3.15.2 <6"
  "katex": ">=0.18.2 <0.20"
  "markdown-it": "^14.3.3"
  "minimatch": ">=9.0.7 <11"
  "nanoid": ">=3.3.18 <4"
  "postcss": ">=8.5.23 <9"
  "protobufjs": ">=7.6.5 <8"
  "proxy-addr": ">=2.0.8 <3"
  "qs": ">=6.16.0 <7"
  "serialize-javascript": ">=7.0.5 <8"
  "source-map-js": ">=1.2.2 <2"
  "tough-cookie": ">=4.1.3 <7"
  "uuid": ">=11.1.1 <15"

<svg viewBox="0 0 600 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FAF8"/>
      <stop offset="50%" stop-color="#CBF3F0"/>
      <stop offset="100%" stop-color="#B2EBE6"/>
    </linearGradient>

    <!-- Cylinder / Shape Gradients -->
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7F5"/>
      <stop offset="40%" stop-color="#99E2D8"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2FCFB"/>
      <stop offset="50%" stop-color="#A7E8DF"/>
      <stop offset="100%" stop-color="#34A89C"/>
    </linearGradient>

    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B6EFEA"/>
    </linearGradient>

    <!-- Soft Ambient Shadows -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#146058" flood-opacity="0.22"/>
    </filter>
    
    <filter id="deepShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="12" dy="24" stdDeviation="18" flood-color="#0E423D" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="600" height="600" fill="url(#bgGrad)" rx="16"/>

  <!-- Geometric Elements arranged in SWIFT 3D isometric pattern -->
  <g transform="rotate(-30 300 300)">
    <!-- Row 1: Discs & Pills -->
    <g filter="url(#deepShadow)">
      <!-- Disc 1 -->
      <circle cx="160" cy="120" r="42" fill="url(#cylinderGrad)"/>
      <circle cx="156" cy="116" r="38" fill="url(#capGrad)"/>
      
      <!-- Pill 1 -->
      <rect x="250" y="90" width="140" height="60" rx="30" fill="url(#pillGrad)"/>
      <rect x="252" y="92" width="136" height="54" rx="27" fill="url(#capGrad)" opacity="0.6"/>

      <!-- Disc 2 -->
      <circle cx="460" cy="120" r="32" fill="url(#cylinderGrad)"/>
      <circle cx="458" cy="118" r="28" fill="url(#capGrad)"/>
    </g>

    <!-- Row 2: Large Obround Pill & Rings -->
    <g filter="url(#deepShadow)">
      <!-- Long Pill -->
      <rect x="90" y="210" width="220" height="64" rx="32" fill="url(#pillGrad)"/>
      <rect x="92" y="212" width="214" height="58" rx="29" fill="url(#capGrad)" opacity="0.7"/>

      <!-- Center Large Disc -->
      <circle cx="390" cy="242" r="54" fill="url(#cylinderGrad)"/>
      <circle cx="386" cy="238" r="48" fill="url(#capGrad)"/>
      <circle cx="386" cy="238" r="22" fill="#2EC4B6" opacity="0.3"/>

      <!-- Small Node -->
      <circle cx="510" cy="242" r="24" fill="url(#pillGrad)"/>
      <circle cx="508" cy="240" r="20" fill="url(#capGrad)"/>
    </g>

    <!-- Row 3: Alternating Nodes & Connectors -->
    <g filter="url(#deepShadow)">
      <!-- Disc Left -->
      <circle cx="130" cy="360" r="48" fill="url(#cylinderGrad)"/>
      <circle cx="126" cy="356" r="42" fill="url(#capGrad)"/>

      <!-- Pill Center -->
      <rect x="230" y="330" width="180" height="60" rx="30" fill="url(#pillGrad)"/>
      <rect x="232" y="332" width="174" height="54" rx="27" fill="url(#capGrad)" opacity="0.6"/>

      <!-- Disc Right -->
      <circle cx="480" cy="360" r="36" fill="url(#cylinderGrad)"/>
      <circle cx="478" cy="358" r="32" fill="url(#capGrad)"/>
    </g>

    <!-- Row 4: Bottom Discs & Slanted Capsule -->
    <g filter="url(#deepShadow)">
      <!-- Pill Bottom Left -->
      <rect x="120" y="450" width="130" height="56" rx="28" fill="url(#pillGrad)"/>
      <rect x="122" y="452" width="124" height="50" rx="25" fill="url(#capGrad)" opacity="0.6"/>

      <!-- Large Center Disc -->
      <circle cx="330" cy="478" r="50" fill="url(#cylinderGrad)"/>
      <circle cx="326" cy="474" r="44" fill="url(#capGrad)"/>

      <!-- Bottom Pill Right -->
      <rect x="430" y="450" width="140" height="56" rx="28" fill="url(#pillGrad)"/>
      <rect x="432" y="452" width="134" height="50" rx="25" fill="url(#capGrad)" opacity="0.6"/>
    </g>
  </g>
</svg>

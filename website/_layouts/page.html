{{#extends "base"}}
{{#block "main"}}
<!-- SPDX-License-Identifier: Apache-2.0 OR MIT -->
<section class="page-hero">
  <div class="container hero-copy">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol><li><a href="/">Docs home</a></li><li aria-current="page">{{eyebrow}}</li></ol>
    </nav>
    <p class="eyebrow eyebrow-hero">{{eyebrow}}</p>
    <h1>{{headline}}</h1>
    <p class="lead hero-lead">{{lead}}</p>
    <div class="article-meta">Last updated <time datetime="{{date}}">{{date}}</time> · Suite version 0.0.41</div>
  </div>
</section>

<section class="section">
  <div class="container">
    <article class="content-body cs-content">
      {{!content}}
    </article>
  </div>
</section>
{{/block}}

<!DOCTYPE html>
<html lang="{{language}}" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />

    <!-- Strict same-origin policy; see README "Security". `form_origin`
         must name your form endpoint or the browser blocks the POST. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'none';
               object-src 'none';
               script-src 'self';
               style-src 'self';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self';
               manifest-src 'self';
               form-action 'self' {{form_origin}}"
    />

    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{permalink}}" />
    <meta property="og:image" content="{{site_url}}images/screenshot.png" />
    <meta property="og:image:width" content="1500" />
    <meta property="og:image:height" content="1000" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{site_url}}images/screenshot.png" />

    <link rel="canonical" href="{{permalink}}" />
    <link rel="icon" href="{{site_path}}favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="{{site_path}}images/favicon.svg" />
    <link rel="apple-touch-icon" href="{{site_path}}images/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "@id": "{{site_url}}#software",
          "name": "Crypto Service Suite",
          "applicationCategory": "SecurityApplication, DeveloperApplication, FinancialApplication",
          "operatingSystem": "Node.js >= 22 (Linux, macOS, Windows); edge runtimes and browsers via crypto-edge",
          "offers": {
            "@type": "Offer",
            "name": "Open source (Apache-2.0 OR MIT)",
            "price": "0",
            "priceCurrency": "USD"
          },
          "description": "Modular Post-Quantum Crypto-as-a-Service (CaaS) operating core for tier-1 banks, custodians, and enterprise treasuries. FIPS 203 ML-KEM and FIPS 204 ML-DSA algorithms (not a validated module) across 18 lockstep packages.",
          "softwareVersion": "0.0.27",
          "license": [
            "https://spdx.org/licenses/Apache-2.0.html",
            "https://spdx.org/licenses/MIT.html"
          ],
          "featureList": [
            "NIST FIPS 203 Post-Quantum Key Encapsulation (ML-KEM-512/768/1024)",
            "NIST FIPS 204 Post-Quantum Digital Signatures (ML-DSA-44/65/87)",
            "Hybrid X25519 + ML-KEM Key Encapsulation",
            "Transparent Database Column Encryption for Prisma and TypeORM",
            "KMS Provider Interface (AWS KMS and local providers implemented)",
            "100% Test Coverage Floor"
          ],
          "author": {
            "@type": "Person",
            "name": "{{author}}",
            "url": "{{site_url}}"
          }
        },
        {
          "@type": "FinancialService",
          "@id": "{{site_url}}#service",
          "name": "Crypto Service Suite — Sovereign Cryptography as a Service",
          "description": "Self-hosted post-quantum cryptography toolkit: FIPS 203/204 algorithm implementations (not a validated module), a KMS provider interface, database field encryption, and CycloneDX CBOM generation that can support DORA assessments.",
          "url": "{{site_url}}",
          "serviceType": "Cryptographic Infrastructure & Key Orchestration",
          "provider": {
            "@type": "Person",
            "name": "Sebastien Rousseau",
            "url": "https://sebastienrousseau.com/"
          }
        },
        {
          "@type": "WebPage",
          "@id": "{{permalink}}#webpage",
          "url": "{{permalink}}",
          "name": "{{title}}",
          "description": "{{description}}",
          "inLanguage": "{{language}}"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="{{site_path}}skeletonic.min.css" />
    <link rel="stylesheet" href="{{site_path}}styles.css" />

    <script src="{{site_path}}theme-init.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    {{> header}}
    <main id="main" role="main">
      {{#block "main"}}{{/block}}
    </main>
    {{> footer}}
    <script src="{{site_path}}main.js" defer></script>
  </body>
</html>

<header class="site-header" role="banner">
  <div class="container header-inner">
    <a class="brand" href="{{site_path}}#hero" aria-label="{{label_home}}">
      <span class="brand-symbol" aria-hidden="true">◆</span>
      <span class="brand-text">{{name}}</span>
      <span class="brand-badge font-mono">INSTITUTIONAL</span>
    </a>
    <button
      class="nav-toggle"
      id="navToggle"
      type="button"
      aria-expanded="false"
      aria-controls="navMenu"
      aria-label="{{label_menu_toggle}}"
    >
      <span class="visually-hidden">{{label_menu}}</span>
      <span class="nav-toggle-icon" aria-hidden="true">☰</span>
    </button>
    <nav class="nav-menu" id="navMenu" aria-label="{{label_nav}}">
      <a class="nav-link" href="{{site_path}}#architecture">{{nav_overview}}</a>
      <a class="nav-link" href="{{site_path}}#packages">Packages (18)</a>
      <a class="nav-link" href="{{site_path}}#standards">Standards</a>
      <a class="nav-link" href="{{site_path}}#comparisons">Comparisons</a>
      <a class="nav-link" href="{{site_path}}research.html">2027 Research</a>
      <a class="nav-link" href="{{site_path}}#security">{{nav_security}}</a>
    </nav>
    <div class="header-actions">
      <span data-ssg-search></span>
      <button
        class="theme-toggle"
        id="mode-toggle"
        type="button"
        data-label-light="{{label_theme_light}}"
        data-label-dark="{{label_theme_dark}}"
      >
        <span class="visually-hidden">{{label_theme}}</span>
        <span class="visually-hidden" id="mode-state" data-label-system="{{label_theme_system}}">{{label_theme_system}}</span>
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
      <a class="btn btn-outline btn-sm" href="https://github.com/sebastienrousseau/crypto-service" target="_blank" rel="noopener noreferrer" aria-label="{{label_github}}">GitHub</a>
      <a class="btn btn-primary btn-sm" href="{{site_path}}#packages">{{cta_primary}}</a>
    </div>
  </div>
</header>

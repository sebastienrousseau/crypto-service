<header class="site-header" role="banner">
  <div class="container header-inner">
    <a class="brand" href="{{site_path}}" aria-label="{{label_home}}">
      <span class="brand-symbol" aria-hidden="true">◆</span>
      <span class="brand-text">{{name}}</span>
      <span class="brand-badge font-mono">INSTITUTIONAL</span>
    </a>
    <button
      class="nav-toggle"
      id="navToggle"
      type="button"
      aria-expanded="false"
      aria-controls="navMenu"
      aria-label="{{label_menu_toggle}}"
    >
      <span class="visually-hidden">{{label_menu}}</span>
      <span class="nav-toggle-icon" aria-hidden="true">☰</span>
    </button>
    <nav class="nav-menu" id="navMenu" aria-label="{{label_nav}}">
      <a class="nav-link" href="{{site_path}}solutions/">Solutions</a>
      <a class="nav-link" href="{{site_path}}standards/">Standards</a>
      <a class="nav-link" href="{{site_path}}research/">2027 Research</a>
      <a class="nav-link" href="{{site_path}}compare/">Compare</a>
      <a class="nav-link" href="{{site_path}}about/">About Us</a>
      <a class="nav-link" href="{{site_path}}contact/">Contact</a>
    </nav>
    <div class="header-actions">
      <span data-ssg-search></span>
      <button
        class="theme-toggle"
        id="mode-toggle"
        type="button"
        data-label-light="{{label_theme_light}}"
        data-label-dark="{{label_theme_dark}}"
      >
        <span class="visually-hidden">{{label_theme}}</span>
        <span class="visually-hidden" id="mode-state" data-label-system="{{label_theme_system}}">{{label_theme_system}}</span>
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
      <a class="btn btn-swift-dark btn-sm" href="{{site_path}}contact/">Institutional Access</a>
    </div>
  </div>
</header>

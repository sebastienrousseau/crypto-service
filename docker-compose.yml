services:
  crypto-server:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=info
      # Passed through from the host. Production refuses to start without
      # a credential (CRYPTO_API_KEY or JWT_SECRET).
      - CRYPTO_API_KEY
      # - JWT_SECRET=at-least-32-bytes-of-secret
      # Required for the v1 PGP routes (sign, revoke, reformat).
      # - CRYPTO_KEY_DIR=/run/secrets/crypto-keys
      # - CORS_ORIGIN=https://your-app.com
      # - TRUSTED_PROXY_CIDRS=10.0.0.0/8
    healthcheck:
      # Same probe as the image's HEALTHCHECK: /ready turns 503 while the
      # server drains for shutdown. 127.0.0.1, because busybox wget may
      # resolve localhost to ::1, where the server does not listen.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  crypto-server-dev:
    build:
      context: .
      target: build
    ports:
      - "3000:3000"
    volumes:
      - ./packages:/app/packages
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=debug
      - ALLOW_ANONYMOUS=1
    command: node packages/crypto-server/dist/index.js
    profiles:
      - dev
